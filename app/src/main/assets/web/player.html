<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>차량 노래방</title>
  <link rel="stylesheet" href="/static/player.css">
</head>
<body>
  <div id="player"></div>

  <div id="idle" class="idle">예약된 곡이 없습니다</div>

  <div id="now" class="now hidden"></div>

  <div id="upnext" class="upnext">
    <div class="upnext-title">다음 곡</div>
    <ol id="queue"></ol>
  </div>

  <div class="controls">
    <span id="conn" class="conn off" title="서버 연결"></span>
    <button id="openPanel">🔍 예약</button>
    <button id="skip">스킵 ⏭</button>
  </div>

  <!-- 호스트 패널: 혼자 쓸 때도 차 화면에서 바로 검색·예약·관리 (영상은 뒤에서 계속 재생) -->
  <aside id="panel" class="panel hidden">
    <div class="panel-head">
      <span class="panel-title">예약 · 관리</span>
      <button id="closePanel" class="icon">✕</button>
    </div>
    <div class="panel-ctrl">
      <button data-act="pause" id="pPlay">⏸</button>
      <button data-act="seekBy" data-sec="10">+10초</button>
      <button data-act="seekBy" data-sec="30">+30초</button>
      <button data-act="skip">스킵</button>
    </div>
    <input id="pq" class="panel-search" type="search" placeholder="곡명, 가수, 번호, 초성" autocomplete="off" enterkeyhint="search">
    <div class="seg" id="pField"><button data-field="all" class="on">전체</button><button data-field="title">제목</button><button data-field="artist">가수</button></div>
    <div class="panel-body">
      <ul id="pResults" class="plist"></ul>
      <div class="panel-sub">예약 목록</div>
      <ol id="pQueue" class="plist"></ol>
    </div>
  </aside>

  <div id="notice" class="notice hidden"></div>

  <div id="nohost" class="nohost hidden">호스트 앱의 "크롬에서 플레이어 열기"로 열어 주세요 (재생 종료를 알릴 수 없어요)</div>

  <div id="start" class="start">
    <div>화면을 탭해서 시작</div>
    <small>소리 있는 재생을 위해 처음 한 번 필요해요</small>
  </div>

  <script src="/static/player.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
